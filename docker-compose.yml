# ZONOS3-Mini voice server for the EPUB reader's "Server voice" (https://github.com/jskenney/epub-reader), with the
# same API as epub-reader-tts-server (Breeze TTS 2): see API.md.
#
#   1. Download the models (about 1.2 GB; Apache-2.0):   ./fetch-models.sh
#   2. Build and start (the first build compiles ZONOS3 with CUDA and takes a while):   docker compose up -d --build
#   3. On your web server, proxy /tts/ to http://<this host>:7860/, /tts-voices/ to http://<this host>:7861/voices/
#      and /tts-studio/ to http://<this host>:7861/ (see nginx.conf.example / Caddyfile.example).
#   4. Open https://<your site>/tts-studio/ to try text, pick built-in voices and create your own.
#
# Needs the NVIDIA Container Toolkit. The API listens on port 7860 on all interfaces (0.0.0.0).
services:
  # ZONOS3-Mini itself (its ggml server, CUDA build). Only the adapter talks to it, so no port is published.
  zonos3:
    build:
      context: ./zonos3
      args:
        # Upstream source, pinned to the commit this setup was written against (README: "Updating ZONOS3").
        ZONOS3_COMMIT: 96d9e0ec1e39083ed336ac78f24e3dbc93721c0f
        # GPU architecture: 120 = Blackwell workstation/consumer (RTX PRO 4000/6000 Blackwell, RTX 50xx),
        # 90 = H100, 89 = RTX 40xx / L4, 86 = RTX 30xx, 80 = A100.
        CUDA_ARCHS: "${ZONOS3_CUDA_ARCHS:-120}"
    image: zonos3-server
    volumes:
      - ${ZONOS3_MODELS_DIR:-./models/zonos3}:/models:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:1919/v2/health"]
      interval: 30s
      timeout: 5s
      start_period: 5m
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # The reader's API (API.md) in front of ZONOS3: what the website proxies /tts/ to.
  adapter:
    build: ./adapter
    image: zonos3-adapter
    environment:
      ZONOS_URL: http://zonos3:1919
      # embedding (the clip's speaker embedding) or reference (the clip itself as the prompt; needs
      # ./fetch-models.sh --reference)
      CLONE_MODE: ${CLONE_MODE:-embedding}
    ports:
      - "7860:7860"
    depends_on:
      - zonos3
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:7860/health"]
      interval: 30s
      timeout: 5s
      start_period: 5m

  # Voice studio: try text, pick built-in voices, record / upload voices, pick clips from long recordings, and
  # manage voices. It also serves the voices to the reader (the website proxies /tts-voices/ to its /voices/).
  # Doesn't need the GPU.
  studio:
    build: ./studio
    image: zonos3-studio
    environment:
      TTS_URL: http://adapter:7860
      ASR_URL: http://asr:7862
      # The path your web server serves the studio at. Set to "" to open it directly on port 7861.
      STUDIO_ROOT_PATH: ${STUDIO_ROOT_PATH:-/tts-studio}
    ports:
      - "7861:7861"
    volumes:
      # The voices (voices.json and the reference clips), kept in ./tts-voices on this machine.
      - ${TTS_VOICES_DIR:-./tts-voices}:/data/voices
      # Long recordings uploaded to pick voice clips from (with their transcripts), kept until you delete them.
      - ${TTS_SOURCES_DIR:-./tts-sources}:/data/sources
    depends_on:
      - adapter
      - asr
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:7861/health"]
      interval: 30s
      timeout: 5s

  # Speech-to-text for the studio's "From a long recording" tab: English Whisper (large-v3-turbo) with word
  # timestamps. Loads the model (about 2 GB of GPU memory) on the first transcription and frees it after 10 idle
  # minutes. Only the studio talks to it, so no port is published.
  asr:
    build: ./asr
    image: zonos3-asr
    environment:
      ASR_MODEL: ${ASR_MODEL:-openai/whisper-large-v3-turbo}
      ASR_IDLE_UNLOAD: ${ASR_IDLE_UNLOAD:-600}
      ASR_BATCH: ${ASR_BATCH:-8}
    volumes:
      - ${ASR_MODELS_DIR:-./asr-models}:/models
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:7862/health"]
      interval: 30s
      timeout: 5s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
